<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="weather__header">
            <form class="weather__search">
                <input type="text" 
                placeholder="Search for a city..." 
                class="weather__searchform">
                <i class="fa-solid fa-magnifying-glass"></i>
            </form>
            <div class="weather__units">
                <span class="weather_unit_celsius">
                    &#176;C
                </span>
                <span class="weather_unit_farenheit">
                    &#176;F
                </span>
            </div>
        </div>
        <!-- Body -->
        <div class="weather__body">
            <h1 class="weather__city"></h1>
            <div class="weather__datetime">
                <p></p>
            </div>
            <div class="weather__forecast">
                <p></p>
            </div>
            <div class="weather__icon">
                <img src="https://openweathermap.org/img/wn/10d@4x.png">
            </div>
            <p class="weather__temperature"></p>
            <div class="weather__minmax">
                <p></p>
                <p></p>
            </div>
        </div>
        <!-- Info -->
        <div class="weather__info">
            <div class="weather__card">
                <i class="fa-solid fa-temperature-full"></i>
                <div>
                    <p>Feels Like</p>
                    <p class="weather__realfeel"></p>
                </div>
            </div>
            <div class="weather__card">
                <i class="fa-solid fa-droplet"></i>
                <div>
                    <p>Humidity</p>
                    <p class="weather__humidity"></p>
                </div>
            </div>
            <div class="weather__card">
                <i class="fa-solid fa-wind"></i>
                <div>
                    <p>Wind</p>
                    <p class="weather__wind">18&#176;</p>
                </div>
            </div>
            <div class="weather__card">
                <i class="fa-solid fa-gauge-high"></i>
                <div>
                    <p>Pressure</p>
                    <p class="weather__pressure"></p>
                </div>
            </div>
            <div class="weather__card">
                <i class="fa-regular fa-sun"></i>
                <div>
                    <p>Sunset</p>
                    <p class="weather__sunset"></p>
                </div>
            </div>
            <div class="weather__card">
                <i class="fa-solid fa-sun"></i>
                <div>
                    <p>Sunrise</p>
                    <p class="weather__sunrise"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/a692e1c39f.js" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
