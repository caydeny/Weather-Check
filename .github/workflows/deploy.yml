name: Deploy Weather Dashboard

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up API key
        run: echo "const API_KEY = '${{ secrets.WEATHER_API_KEY }}';" > public/config.js

      - name: Build the app (if applicable)
        run: echo "Build step goes here"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  
          folder: public
