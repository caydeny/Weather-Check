<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="app-grid">
            <!-- Sidebar -->
            <div class="sidebar">
                <form class="weather__search">
                    <input type="text" 
                    placeholder="Search for a city..." 
                    class="weather__searchform">
                    <button type="submit" class="search-button">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>

                <div class="weather__controls">
                    <div class="weather__units">
                        <span class="weather_unit_celsius active">
                            &#176;C
                        </span>
                        <span class="weather_unit_farenheit">
                            &#176;F
                        </span>
                    </div>
                    <button class="weather__location-btn" title="Use current location">
                        <i class="fa-solid fa-location-dot"></i>
                    </button>
                </div>
                
                <div class="current-weather">
                    <div class="weather__forecast">
                        <p></p>
                    </div>
                    <div class="weather__icon">
                        <img src="" alt="Weather icon">
                    </div>
                    <p class="weather__temperature"></p>
                    
                    <div class="weather__minmax">
                        <p></p>
                        <p></p>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="location-info">
                    <h1 class="weather__city"></h1>
                    <div class="weather__datetime">
                        <p></p>
                    </div>
                </div>

                <!-- Weather Info Cards -->
                <div class="weather__info">
                    <div class="weather__card">
                        <i class="fa-solid fa-temperature-full"></i>
                        <p>Feels Like</p>
                        <p class="weather__realfeel"></p>
                    </div>
                    <div class="weather__card">
                        <i class="fa-solid fa-droplet"></i>
                        <p>Humidity</p>
                        <p class="weather__humidity"></p>
                    </div>
                    <div class="weather__card">
                        <i class="fa-solid fa-wind"></i>
                        <p>Wind</p>
                        <p class="weather__wind"></p>
                    </div>
                    <div class="weather__card">
                        <i class="fa-solid fa-gauge-high"></i>
                        <p>Pressure</p>
                        <p class="weather__pressure"></p>
                    </div>
                    <div class="weather__card">
                        <i class="fa-regular fa-sun"></i>
                        <p>Sunrise</p>
                        <p class="weather__sunrise"></p>
                    </div>
                    <div class="weather__card">
                        <i class="fa-solid fa-sun"></i>
                        <p>Sunset</p>
                        <p class="weather__sunset"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="weather__footer">
            <p>Data provided by <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a></p>
            <p class="weather__last-updated">Last updated: <span></span></p>
        </div>

        <!-- Loading State -->
        <div class="weather__loading">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Error Message -->
        <div class="weather__error">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p>City not found. Please try again.</p>
            <button>Try Again</button>
        </div>        
    </div>
    <script src="https://kit.fontawesome.com/c62ae0f792.js" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
